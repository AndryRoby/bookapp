<style>

  * { box-sizing:border-box; }
  html { color-scheme: dark; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:24px;

  .brand { display:inline-flex; align-items:center; gap:9px; text-decoration:none; color:var(--text); font-weight:700; font-size:16px; margin-bottom:26px; }
  .brand .mono { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:7px; background:#100c09; font-family: Georgia, 'Times New Roman', serif; color:var(--accent); font-size:17px; }
  .code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--muted); margin:0 0 10px; }
  h1 { font-size:24px; margin:0 0 12px; letter-spacing:-0.01em; }
  p.sub { color:var(--muted); font-size:15px; margin:0 0 26px; }
  .btn { display:inline-flex; align-items:center; gap:8px; text-decoration:none; font-weight:600; font-size:15px; padding:11px 20px; border-radius:10px; background:var(--accent); color:var(--accent-ink); }
  .btn:hover { filter:brightness(1.05); }
</style>
